name: Go checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build all packages
        run: go build ./...

      - name: Run Go tests
        run: go test -v ./...

      - name: Check CLI behavior
        run: sh scripts/check-cli.sh
